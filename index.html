<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ارسال پیام تست به تلگرام</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#101114;color:#f4f1ea;font-family:Tahoma,Arial,sans-serif}
    main{width:min(100%,480px);padding:28px;border:1px solid #383838;border-radius:18px;background:#191a1e;box-shadow:0 18px 55px #0007}
    h1{margin:0 0 10px;font-size:22px}
    p{color:#b8b8b8;line-height:1.9;font-size:13px}
    textarea{width:100%;min-height:110px;padding:13px;border:1px solid #45464c;border-radius:10px;background:#111216;color:#fff;font:inherit;resize:vertical}
    button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:10px;background:#d2b477;color:#171717;font-size:15px;font-weight:bold;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}
    #status{margin-top:15px;min-height:24px;font-size:13px;line-height:1.8}
    .ok{color:#70d69a}.err{color:#ff8989}
  </style>
</head>
<body>
<main>
  <h1>ارسال پیام آزمایشی تلگرام</h1>
  <p>با زدن دکمه، پیام زیر به چت تلگرام با شناسه مقصد تنظیم‌شده ارسال می‌شود.</p>
  <textarea id="message">سلام! پیام آزمایشی سایت عروسی با موفقیت ارسال شد.</textarea>
  <button id="send">ارسال پیام تست</button>
  <div id="status" role="status"></div>
</main>
<script>
  // توکن و شناسه مقصد برای تست داخل فایل قرار داده شده‌اند.
  const BOT_TOKEN = "9045759085:AAH8sMz06IshjmnlHHFQZMEb7wDIUoE7cVQ";
  const CHAT_ID = "5327269429";

  const button = document.getElementById("send");
  const statusBox = document.getElementById("status");

  button.addEventListener("click", async () => {
    const message = document.getElementById("message").value.trim();
    if (!message) {
      statusBox.className = "err";
      statusBox.textContent = "متن پیام خالی است.";
      return;
    }

    button.disabled = true;
    statusBox.className = "";
    statusBox.textContent = "در حال ارسال...";

    try {
      const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({chat_id: CHAT_ID, text: message})
      });
      const result = await response.json();

      if (response.ok && result.ok) {
        statusBox.className = "ok";
        statusBox.textContent = "پیام با موفقیت ارسال شد.";
      } else {
        statusBox.className = "err";
        statusBox.textContent = "ارسال ناموفق: " + (result.description || "خطای نامشخص");
      }
    } catch (error) {
      statusBox.className = "err";
      statusBox.textContent = "خطا در ارتباط: " + error.message;
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
