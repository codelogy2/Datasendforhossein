<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تست ارسال پیام تلگرام</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 24px; background: #10100f; color: #f2eee6;
    font-family: Tahoma, Arial, sans-serif;
  }
  main {
    width: min(100%, 420px); padding: 30px 24px; text-align: center;
    background: #20201c; border: 1px solid rgba(201,170,114,.35);
    border-radius: 18px;
  }
  h1 { color: #e7d2a8; font-size: 21px; }
  #status { margin-top: 22px; line-height: 2; }
</style>
</head>
<body>
<main>
  <h1>تست ارسال پیام تلگرام</h1>
  <p id="status">در حال ارسال درخواست...</p>
</main>

<script>
  // توکن جدید ربات را اینجا وارد کن؛ توکن قبلی را در BotFather باطل کن.
  const BOT_TOKEN = "PASTE_NEW_BOT_TOKEN_HERE";
  const CHAT_ID = "1627671786";

  const message = "مهمون جدید داری🫠\nنام:مهمون تستی\nمیاد؟اره";
  const status = document.getElementById("status");

  if (!BOT_TOKEN || BOT_TOKEN === "PASTE_NEW_BOT_TOKEN_HERE") {
    status.textContent = "ابتدا توکن جدید ربات را داخل فایل وارد کن.";
  } else {
    const url =
      "https://api.telegram.org/bot" + encodeURIComponent(BOT_TOKEN) +
      "/sendMessage?chat_id=" + encodeURIComponent(CHAT_ID) +
      "&text=" + encodeURIComponent(message);

    // ارسال با Image beacon تا به محدودیت CORS خواندن پاسخ برخورد نکنیم.
    const beacon = new Image();
    beacon.onload = () => {
      status.textContent = "درخواست ارسال شد؛ پاسخ تلگرام از این روش قابل تأیید نیست.";
    };
    beacon.onerror = () => {
      status.textContent = "درخواست ارسال شد؛ وضعیت نهایی قابل بررسی نیست.";
    };
    beacon.src = url;
    status.textContent = "درخواست ارسال شد؛ در حال بررسی ارتباط...";
  }
</script>
</body>
</html>
