
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telegram Test</title>

<style>
body {
  background:#10100f;
  color:#f2eee6;
  font-family:Tahoma;
  display:grid;
  place-items:center;
  min-height:90vh;
}
main {
  background:#20201c;
  border:1px solid #c9aa72;
  border-radius:18px;
  padding:30px;
  width:80%;
  max-width:400px;
  text-align:center;
}
button {
  background:#c9aa72;
  border:0;
  padding:14px 25px;
  border-radius:10px;
  font-size:15px;
  cursor:pointer;
}
#status {
  color:#e7d2a8;
  line-height:2;
}
</style>
</head>

<body>
<main>
  <h2>سامانه مدیریت مهمانان</h2>
  <p>تست ارتباط با ربات تلگرام</p>
  <button onclick="sendMessage()">ارسال گزارش آزمایشی</button>
  <p id="status">آماده ارسال</p>
</main>

<script>

// توکن جدید ربات را اینجا قرار بده
const TOKEN = "9045759085:AAH8sMz06IshjmnlHHFQZMEb7wDIUoE7cVQ";

const CHAT_ID = "1627671786";

function sendMessage() {

  if (TOKEN === "PASTE_NEW_TOKEN_HERE") {
    document.getElementById("status").innerText =
      "ابتدا توکن ربات را وارد کن";
    return;
  }

  const now = new Date();

  const date = new Intl.DateTimeFormat("fa-IR-u-ca-persian", {
    timeZone: "Asia/Tehran",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).format(now);

  const time = new Intl.DateTimeFormat("fa-IR", {
    timeZone: "Asia/Tehran",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hour12: false
  }).format(now);

  const registrationID =
    "GST-" + Math.floor(100000 + Math.random() * 900000);

  const message = `
✦ سامانه مدیریت مهمانان
━━━━━━━━━━━━━━━━━━

🟢 ثبت مهمان جدید

👤 اطلاعات مهمان

نام و نام خانوادگی: مهمون تستی
وضعیت حضور: بله، تأیید شد

شناسه ثبت‌نام: ${registrationID}

━━━━━━━━━━━━━━━━━━

🗓 اطلاعات ثبت‌نام

تاریخ ثبت: ${date}
ساعت ثبت: ${time}
منطقه زمانی: تهران

منبع ثبت: وب‌سایت مراسم
وضعیت پردازش: درخواست ارسال

━━━━━━━━━━━━━━━━━━
گزارش خودکار سامانه ثبت مهمانان
  `.trim();

  const url =
    "https://api.telegram.org/bot" +
    TOKEN +
    "/sendMessage?chat_id=" +
    encodeURIComponent(CHAT_ID) +
    "&text=" +
    encodeURIComponent(message);

  // باز کردن پاسخ واقعی API تلگرام
  const resultWindow = window.open(url, "_blank");

  document.getElementById("status").innerText =
    resultWindow
      ? "پاسخ API در تب جدید باز شد؛ نتیجه را بررسی کن."
      : "پنجره باز نشد؛ اجازه باز شدن پنجره جدید را بده.";
}

</script>
</body>
</html>
